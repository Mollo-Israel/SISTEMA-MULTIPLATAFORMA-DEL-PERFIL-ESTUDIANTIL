# Flujo del estudiante: abrir proyectos y compartir el perfil
# (Investigación §3.4 y tareas de §3.8). En el móvil se comparte el enlace del
# perfil, que es lo mismo que lleva el código QR; la imagen del QR se imprime
# desde la web. Mismos requisitos que el flujo 01.
appId: com.afinia.app
env:
  EMAIL: ana.quispe@est.univalle.edu
  PASSWORD: Univalle2026*
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "nombre.apellido@est.univalle.edu"
    timeout: 60000
- tapOn: "nombre.apellido@est.univalle.edu"
- inputText: ${EMAIL}
- tapOn:
    text: ".*contraseña.*"
    optional: true
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "Ingresar"
- extendedWaitUntil:
    visible: ".*Hola, Ana.*"
    timeout: 30000
# Proyectos: el portafolio propio.
- tapOn: ".*, Proyectos"
- extendedWaitUntil:
    visible: "Portafolio"
    timeout: 20000
- takeScreenshot: 08-proyectos
# Perfil → Colaboración y equipos: enlace compartible (el contenido del QR)
# y canales de contacto; no hay chat dentro de Afinia.
- tapOn: ".*, Perfil"
- scrollUntilVisible:
    element: "Colaboración y equipos"
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn: "Colaboración y equipos"
- extendedWaitUntil:
    visible: ".*El código QR lleva solo este enlace.*"
    timeout: 20000
- assertNotVisible: "Mensajes"
- takeScreenshot: 09-colaboracion-qr
- scrollUntilVisible:
    element: "Cómo contactarte"
    direction: DOWN
    timeout: 20000
# Salir vuelve a la pantalla de ingreso.
- back
- tapOn: "Cerrar sesión"
- extendedWaitUntil:
    visible: "Ingresar"
    timeout: 20000
