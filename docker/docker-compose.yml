services:
  postgres:
    image: postgres:16-alpine
    container_name: perfil_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-perfil_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-perfil_pass}
      POSTGRES_DB: ${POSTGRES_DB:-perfil_estudiantil}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-perfil_user} -d ${POSTGRES_DB:-perfil_estudiantil}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Opcional: buzón de pruebas para ver los correos con su diseño real sin
  # enviarlos a nadie. No arranca con db:up; se levanta con npm run mail:preview
  # y se abre en http://localhost:8025 (ver docs/CORREO_REAL.md).
  mailpit:
    image: axllent/mailpit:latest
    container_name: perfil_mailpit
    profiles: ["correo"]
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
    name: perfil_pgdata
