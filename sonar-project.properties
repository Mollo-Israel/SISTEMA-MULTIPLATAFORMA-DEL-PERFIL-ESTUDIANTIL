# Análisis de calidad interna con SonarQube (V2 §79.9).
#
# Uso, con un servidor SonarQube local en Docker:
#   docker run -d --name sonarqube -p 9000:9000 sonarqube:community
#   (crear un token en http://localhost:9000)
#   docker run --rm -e SONAR_HOST_URL=http://host.docker.internal:9000 \
#     -e SONAR_TOKEN=<token> -v "$PWD:/usr/src" sonarsource/sonar-scanner-cli
#
# No se persigue 100 % de cobertura (§79.9): interesan bugs, vulnerabilidades,
# código duplicado y olores en la lógica de negocio.
sonar.projectKey=afinia
sonar.projectName=Afinia
sonar.sourceEncoding=UTF-8
sonar.sources=api/src,web/src,mobile/src,shared/src
sonar.tests=api/test,scripts
sonar.test.inclusions=api/test/**/*.ts,scripts/e2e-*.mjs
sonar.exclusions=**/node_modules/**,**/dist/**,**/dist-e2e/**,api/src/database/migrations/**,api/src/database/seeds/**
sonar.javascript.lcov.reportPaths=api/coverage/lcov.info
