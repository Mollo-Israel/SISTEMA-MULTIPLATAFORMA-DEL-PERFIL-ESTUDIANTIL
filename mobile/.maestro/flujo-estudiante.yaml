# Flujo representativo del estudiante en la app móvil (V2 §79.5; V3 BATCH 22).
#
# Requiere Android Emulator (o un dispositivo) con un Expo Development Build
# instalado y la API accesible desde el emulador (10.0.2.2:3010). En esta
# máquina no hay SDK de Android: el flujo queda listo para correr con
#   maestro test mobile/.maestro/flujo-estudiante.yaml \
#     -e EMAIL=estudiante@est.univalle.edu -e PASSWORD=...
# La cuenta debe existir y haber terminado la bienvenida.
appId: host.exp.exponent
---
- launchApp:
    clearState: true
- tapOn: "nombre.apellido@est.univalle.edu"
- inputText: ${EMAIL}
- tapOn:
    id: "password"
    optional: true
- inputText: ${PASSWORD}
- tapOn: "Ingresar"
- assertVisible: "Inicio"
# Actividades (V3 §34.2): «Para ti» primero, luego todas, inscritas e historial.
- tapOn: "Actividades"
- assertVisible: "Para ti"
- assertVisible: "Más sugerencias"
- tapOn: "Todas"
- assertVisible: "Buscar por título, lugar, categoría o área…"
- tapOn: "Historial"
# Avisos (V3 §33): el centro de notificaciones con su contador.
- tapOn: "Avisos"
- assertVisible: "Sin leer"
# Afinidad: el detalle explica de dónde sale cada punto.
- tapOn: "Afinidad"
- assertVisible: "Mis afinidades"
# Mi trayectoria (V3 §42): niveles en palabras.
- tapOn: "Perfil"
- tapOn: "Mi trayectoria"
- assertVisible: "Cómo leerla"
- assertVisible: "Corroborado"
- back
# Colaboración (V3 §55): necesidades abiertas y canales; no hay chat (V2 §57).
- tapOn: "Colaboración y equipos"
- assertVisible: "Necesidades abiertas para ti"
- assertVisible: "Cómo contactarte"
- assertNotVisible: "Mensajes"
# Salir.
- tapOn: "Salir"
- assertVisible: "Ingresar"
